name: floi
screenshots:
  path: "foii-screenshot.png"

description: "An easy-to-grasp menstrual cycle tracking app that helps users monitor menstrual cycle and fertility."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive_flutter: ^1.1.0
  intl: 
  collection: ^1.17.0
  shared_preferences:
  smooth_page_indicator: ^1.1.0 
  file_picker: ^12.2.0
  hugeicons: ^1.1.0
  skeletonizer: ^3.0.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: 
  hive_generator: ^2.0.1
  hive: ^2.2.3
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - lib/icons/

# Generated splash screen. Never edit android/app/src/main/res/**styles.xml or
# launch_background.xml by hand - change this block and re-run:
#   dart run flutter_native_splash:create
# Colours mirror AppColors: backgroundLight / backgroundDark.
flutter_native_splash:
  color: "#FDF2F8"
  image: lib/icons/icon-512.png
  color_dark: "#1A0B2E"
  image_dark: lib/icons/icon-512.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FDF2F8"
    image: lib/icons/icon-512.png
    color_dark: "#1A0B2E"
    image_dark: lib/icons/icon-512.png